<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background glow & metallic gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1a26"/>
      <stop offset="60%" stop-color="#070c12"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <radialGradient id="shieldRim" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3dd4e3"/>
      <stop offset="25%" stop-color="#164d59"/>
      <stop offset="65%" stop-color="#0d2830"/>
      <stop offset="100%" stop-color="#061317"/>
    </radialGradient>

    <radialGradient id="woodPlanks" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2d3d"/>
      <stop offset="45%" stop-color="#121d28"/>
      <stop offset="85%" stop-color="#0a1118"/>
      <stop offset="100%" stop-color="#060b10"/>
    </radialGradient>

    <radialGradient id="bossGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d6b579"/>
      <stop offset="40%" stop-color="#8c6d36"/>
      <stop offset="80%" stop-color="#3a2c14"/>
      <stop offset="100%" stop-color="#151007"/>
    </radialGradient>

    <filter id="cyanNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base canvas rounded for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#spaceGlow)"/>

  <!-- Subtle sci-fi grid overlay -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(112, 217, 229, 0.15)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="rgba(214, 181, 121, 0.2)" stroke-width="1"/>

  <!-- Outer Viking Shield Rim -->
  <circle cx="256" cy="256" r="210" fill="url(#shieldRim)" stroke="#70d9e5" stroke-width="4" filter="url(#cyanNeon)"/>

  <!-- Metal rim rivets (8 bolts around the shield) -->
  <g fill="#d6b579">
    <circle cx="256" cy="58" r="7"/>
    <circle cx="396" cy="116" r="7"/>
    <circle cx="454" cy="256" r="7"/>
    <circle cx="396" cy="396" r="7"/>
    <circle cx="256" cy="454" r="7"/>
    <circle cx="116" cy="396" r="7"/>
    <circle cx="58" cy="256" r="7"/>
    <circle cx="116" cy="116" r="7"/>
  </g>

  <!-- Wooden Shield Face with Planks -->
  <circle cx="256" cy="256" r="190" fill="url(#woodPlanks)"/>
  
  <!-- Plank seams -->
  <path d="M120 110 L120 402 M188 72 L188 440 M256 66 L256 446 M324 72 L324 440 M392 110 L392 402" 
        stroke="rgba(0, 0, 0, 0.6)" stroke-width="4"/>
  <path d="M122 110 L122 402 M190 72 L190 440 M258 66 L258 446 M326 72 L326 440 M394 110 L394 402" 
        stroke="rgba(112, 217, 229, 0.12)" stroke-width="1.5"/>

  <!-- Nordic Sci-Fi Rune Sigils (Viking Runes & Compass Motif in glowing cyan) -->
  <g stroke="#70d9e5" stroke-width="3" fill="none" opacity="0.85" filter="url(#cyanNeon)">
    <!-- 8 directional ray runes -->
    <line x1="256" y1="130" x2="256" y2="185"/>
    <path d="M250 145 L256 130 L262 145"/>

    <line x1="256" y1="327" x2="256" y2="382"/>
    <path d="M250 367 L256 382 L262 367"/>

    <line x1="130" y1="256" x2="185" y2="256"/>
    <path d="M145 250 L130 256 L145 262"/>

    <line x1="327" y1="256" x2="382" y2="256"/>
    <path d="M367 250 L382 256 L367 262"/>

    <!-- Diagonal branches -->
    <line x1="167" y1="167" x2="206" y2="206"/>
    <line x1="306" y1="306" x2="345" y2="345"/>
    <line x1="345" y1="167" x2="306" y2="206"/>
    <line x1="206" y1="306" x2="167" y2="345"/>

    <!-- Circuit crosslinks -->
    <circle cx="256" cy="256" r="105" stroke-dasharray="4 12" stroke-width="2"/>
  </g>

  <!-- Central Shield Boss (Umbo) in aged bronze/gold -->
  <circle cx="256" cy="256" r="76" fill="url(#bossGlow)" stroke="#f0ce86" stroke-width="4" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#221706" stroke-width="2"/>

  <!-- Boss Rivets -->
  <g fill="#f2e2be">
    <circle cx="256" cy="192" r="4.5"/>
    <circle cx="301" cy="211" r="4.5"/>
    <circle cx="320" cy="256" r="4.5"/>
    <circle cx="301" cy="301" r="4.5"/>
    <circle cx="256" cy="320" r="4.5"/>
    <circle cx="211" cy="301" r="4.5"/>
    <circle cx="192" cy="256" r="4.5"/>
    <circle cx="211" cy="211" r="4.5"/>
  </g>

  <!-- Glowing Helmar Valknut/Runic Core in center -->
  <g stroke="#ffffff" stroke-width="3" fill="none" filter="url(#cyanNeon)">
    <!-- Runic Viking H (Hagalaz / Helmar glyph) -->
    <line x1="238" y1="230" x2="238" y2="282" stroke="#70d9e5" stroke-width="5" stroke-linecap="round"/>
    <line x1="274" y1="230" x2="274" y2="282" stroke="#70d9e5" stroke-width="5" stroke-linecap="round"/>
    <line x1="238" y1="244" x2="274" y2="268" stroke="#70d9e5" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
